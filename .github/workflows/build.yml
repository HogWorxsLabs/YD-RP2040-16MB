name: Build MicroPython for YD-RP2040-16MB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout MicroPython
        uses: actions/checkout@v4
        with:
          repository: micropython/micropython
          fetch-depth: 0
      
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential
      
      - name: Initialize submodules
        run: |
          make -C ports/rp2 submodules
      
      - name: Build mpy-cross
        run: |
          make -C mpy-cross
      
      - name: Create board definition
        run: |
          mkdir -p ports/rp2/boards/YD_RP2040_16MB
          
          cat > ports/rp2/boards/YD_RP2040_16MB/mpconfigboard.h << 'EOF'
          // Board configuration for YD-RP2040 with 16MB flash
          
          #define MICROPY_HW_BOARD_NAME           "YD-RP2040-16MB"
          #define MICROPY_HW_FLASH_STORAGE_BYTES  (15 * 1024 * 1024)
          EOF
          
          cat > ports/rp2/boards/YD_RP2040_16MB/mpconfigboard.cmake << 'EOF'
          set(PICO_BOARD "pico")
          set(PICO_PLATFORM "rp2040")
          set(PICO_FLASH_SIZE_BYTES 16777216)
          EOF
      
      - name: Build firmware
        run: |
          cd ports/rp2
          make BOARD=YD_RP2040_16MB CFLAGS_EXTRA=-Wno-error
      
      - name: Upload UF2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: micropython-yd-rp2040-16mb
          path: ports/rp2/build-YD_RP2040_16MB/firmware.uf2
